<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#eaf1ef;--skyA:#d3e6ee;--surface:#fffefb;--ink:#1d3a4a;--mute:#566d78;--line:#cfe0db;--gold:#a96d12;--goldbg:#faeed6;--sage:#3f8a76;--sagebg:#dcede7;--rose:#b4513f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0f1c27;--surface:#172a39;--ink:#e8eff3;--mute:#9db0bd;--line:#2a4052;--gold:#e8b547;--goldbg:#3a3118;--sage:#7fc0a8;--sagebg:#1d3b32;--rose:#e58a77}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) linear-gradient(var(--skyA,var(--bg)),var(--bg) 420px) no-repeat;color:var(--ink);font:17px/1.55 'Literata',Georgia,serif}

main{max-width:620px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:2rem;line-height:1.1;margin:.2em 0 .4em;letter-spacing:-.02em}h2{font-size:1.3rem;margin:1.3em 0 .5em}h3{font-size:1rem;margin:0 0 .3em}p{margin:.5em 0}
.mute{color:var(--mute);font-size:.92rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 22px -14px rgba(20,40,58,.35)}
.north{background:var(--ink);color:var(--bg);border:0;border-radius:24px 24px 24px 4px}.north .mute{color:inherit;opacity:.75}

button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}button.small{padding:6px 14px;font-size:.85rem}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row .fit{flex:none}
.hero{text-align:center}.hero svg{width:100%;height:auto;max-height:180px}.hero h1{font-size:2.05rem}.lead{font-size:1.05rem}
.sun{fill:#e8b547;animation:bob 9s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.setcard{display:flex;gap:14px;align-items:flex-start}.badge{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:var(--sagebg)}
.eg{font-style:italic;color:var(--mute);font-size:.92rem;margin:.3em 0 0}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font-weight:500;font-size:.92rem}

.emo .pill{font-size:1.3rem;padding:6px 10px;line-height:1}
.vchip{display:inline-flex;align-items:center;gap:6px;background:var(--sagebg);color:var(--ink);border-radius:99px;padding:6px 8px 6px 14px;margin:4px 6px 4px 0;font:500 .95rem 'Bricolage Grotesque',sans-serif}
.vchip button,.x{background:none;color:var(--mute);padding:0 6px;font-weight:400;font-size:1.2rem;border-radius:99px}
.tile{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;margin:8px 0;font:700 1.05rem 'Bricolage Grotesque',sans-serif}.tile .em{font-size:1.9rem;line-height:1}.tile .x{margin-left:auto}
.def{background:var(--goldbg);border-radius:16px;padding:14px;margin:12px 0}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}
.box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--mute);background:transparent;padding:0;margin-top:1px;color:#fff;display:grid;place-items:center}
.done .box{background:var(--sage);border-color:var(--sage)}.done .t{text-decoration:line-through;color:var(--mute)}
.chip{display:inline-block;font:500 .78rem 'Bricolage Grotesque',sans-serif;padding:2px 10px;border-radius:99px;margin:4px 6px 0 0;background:var(--sagebg)}
.chip.why,.chip.due{background:var(--goldbg);color:var(--gold)}.chip.late,.chip.none{background:transparent;border:1px dashed var(--rose);color:var(--rose)}
.ring{width:150px;height:150px;flex:none}.rn{font:700 28px 'Bricolage Grotesque';fill:var(--ink)}.rl2{font:500 10px 'Bricolage Grotesque';fill:var(--mute)}
.legend{display:flex;flex-direction:column;gap:6px;font:500 .9rem 'Bricolage Grotesque',sans-serif}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;transition:width .5s;background:var(--sage)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.grid .h{font:700 .75rem 'Bricolage Grotesque';color:var(--mute)}
.cell{padding:6px 0;min-height:52px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:.9rem}
.cell[aria-pressed=true]{border:2px solid var(--gold)}.cell.td{background:var(--goldbg)}.dots{display:flex;gap:2px;justify-content:center;margin-top:3px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%}
.ct{display:flex;gap:10px;align-items:center;padding:6px 0}.ct.done span{text-decoration:line-through;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(10,25,35,.6);display:grid;place-items:center;z-index:10;padding:18px}.cr{width:100%;max-width:440px}
.strike{position:relative;font:700 1.5rem/1.3 'Bricolage Grotesque',sans-serif;padding:26px 14px;margin:12px 0;background:var(--goldbg);border-radius:14px;text-align:center}
.strike canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
button.arrow{font-size:1.9rem;line-height:1;padding:0;width:60px;height:50px;font-weight:700;border:2px solid var(--ink)}input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px}html{-webkit-text-size-adjust:100%}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.brand{font:700 1.15rem 'Bricolage Grotesque',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}.brand::after{content:"";display:block;width:56px;height:4px;border-radius:2px;background:#e8b547;margin:6px auto 0}.brand.sm{font-size:.8rem;margin-bottom:6px}.brand.sm::after{margin:4px 0 0;width:36px;height:3px}.cf{position:fixed;font-size:1.6rem;pointer-events:none;z-index:20}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--sage);color:#fff;padding:14px 16px;border-radius:16px;font:500 1rem 'Bricolage Grotesque',sans-serif;z-index:30}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:620px}nav a{flex:1;text-align:center;padding:14px 2px;font-weight:700;font-size:.8rem;color:var(--mute);cursor:pointer;border-top:3px solid transparent}
nav a[aria-current=page]{color:var(--ink);border-top-color:#e8b547}
@media (prefers-reduced-motion:reduce){.sun{animation:none}*{transition:none!important}}
</style></head><body>
<main id="app"></main><div id="nav"></div>
<script>
(function(){
var islide=0,showIntro=false,KEY='northlist-v1',COL=['#e0694f','#3f9a82','#5b82d6','#d09030','#a468cf','#d9578f','#2f9bb5','#7a9a2f','#e07b2a','#6b6fd1'],EMO=['🏀','📚','💛','🌿','🎨','💰','🤝','🧘','🎵','🚀','🌍','⭐'],S,tmp={e:'',g:'',rating:0,block:'',nt:'',ng:''},toastT;

var GUESS=[[/athlet|sport|fit|strong|run|gym|train/i,'🏀'],[/learn|student|study|curio|read|scholar|smart/i,'📚'],[/friend|kind|caring|listen|present|parent|family|love/i,'💛'],[/health|well|calm|mind|sleep|rest|balanc/i,'🌿'],[/creat|art|writ|music|maker/i,'🎨'],[/money|financ|saving|budget/i,'💰'],[/lead|team|reliab|profession|career|work/i,'🤝'],[/adventur|travel|explor/i,'🌍']];

function touched(){var o=[];weekDone().forEach(function(t){if(t.goalId&&goal(t.goalId)&&o.indexOf(t.goalId)<0)o.push(t.goalId)});return o}
function streak(){var d={};S.tasks.forEach(function(t){if(t.done&&t.doneAt)d[ld(new Date(t.doneAt))]=1});var x=new Date(),n=0;if(!d[ld(x)])x.setDate(x.getDate()-1);while(d[ld(x)]){n++;x.setDate(x.getDate()-1)}return n}

 S.values.map(function(v,i){return '<span class="vchip">'+esc(v)+'<button data-a="rv" data-i="'+i+'" aria-label="Remove '+esc(v)+'">&times;</button></span>'}).join('')+'</div>'+(S.values.length?'<p class="mute">'+S.values.length+' added.</p>':'')}
function goalsEditor(){
 var full=S.goals.length>=10;
 return '<div class="def"><b>What is a “be” goal?</b> It describes <i>who you want to become</i>, not something to finish. “Get an A on the exam” is a do-goal. “Be a dedicated student” is a “be” goal, and the exam is one of many tasks that serve it. Ask yourself: <i>Who do I want to be?</i></div><p class="mute">Tap an example to try it, or write your own.</p><div class="pills">'+
 EX.map(function(x){return '<button class="pill" data-a="ex" data-t="'+x[0]+'" data-e="'+x[1]+'">'+x[1]+' '+x[0]+'</button>'}).join('')+'</div>'+
 (full?'<p class="mute"><b>You have 10 goals, the maximum.</b></p>':'<label for="gi">Add <b>one</b> “be” goal at a time (goal '+(S.goals.length+1)+' of up to 10)</label><input type="text" id="gi" maxlength="40" placeholder="I want to be..."><label>Pick an icon for it (or we will choose one)</label><div class="pills emo" role="group" aria-label="Icon">'+EMO.map(function(e){return '<button class="pill" data-a="emo" data-e="'+e+'" aria-pressed="'+(tmp.e===e)+'" aria-label="Icon '+e+'">'+e+'</button>'}).join('')+'</div><p><button data-a="ag">Add this goal</button></p>')+
 '<div aria-live="polite">'+S.goals.map(function(g){return '<div class="tile" style="'+tint(g)+'"><span class="em">'+g.emoji+'</span>'+esc(g.text)+'<button class="x" data-a="rg" data-id="'+g.id+'" aria-label="Remove '+esc(g.text)+'">&times;</button></div>'}).join('')+'</div>'}

/* ---------- setup ---------- */
function landing(){
 var c=function(e,t,d,x){return '<div class="card setcard"><div class="badge" aria-hidden="true">'+e+'</div><div><h3>'+t+'</h3><p style="margin:0">'+d+'</p><p class="eg">'+x+'</p></div></div>'};
 return '<div class="hero"><svg viewBox="0 0 400 170" role="img" aria-label="A sun rising over calm hills"><circle class="sun" cx="285" cy="76" r="36"/><path d="M92 34l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#e8b547"/><path d="M0 130Q70 90 150 118T300 112T400 120V170H0Z" fill="var(--sage)" opacity=".3"/><path d="M0 150Q90 118 190 142T400 138V170H0Z" fill="var(--sage)" opacity=".55"/><path d="M0 165Q100 148 200 160T400 156V170H0Z" fill="var(--sage)"/></svg><p class="brand">Aligned</p><h1>Get your tasks aligned with your purpose.</h1><p class="lead">Aligned connects everyday tasks, from assignments and shifts to workouts and errands, to your larger purpose. See your weekly goal ring fill up, cross tasks off by hand, and get a recap of where your time went.</p><p><button data-a="go">Start my foundation</button></p><p class="mute">About 3 minutes. You can change everything later.</p></div><h2>What you will set up</h2>'+
 c('🧭','Your purpose','The reason behind what you do: what you want your life to contribute to.','Example: To help people feel less alone.')+c('🌿','Your values','The principles you want your choices to reflect, added one at a time.','Example: curiosity, family, honesty.')+c('🌱','Your “be” goals','Who you want to become, rather than what you want to achieve. Each gets its own icon and color, and every task links to one.','Example: a dedicated athlete, a curious learner.')}
function arrowsSvg(al){var P=[[20,20],[80,14],[140,22],[16,60],[144,62],[30,88],[80,90],[130,86]],R=[200,40,300,110,20,250,170,330],h='<svg viewBox="0 0 160 104" role="img" aria-label="'+(al?'Arrows all pointing at one star: aligned':'Arrows pointing in random directions: scattered')+'" style="width:100%;height:auto"><path d="M80 42l3.5 8 8 3.5-8 3.5-3.5 8-3.5-8-8-3.5 8-3.5z" fill="#e8b547"/>';P.forEach(function(p,i){var a=al?Math.atan2(53-p[1],80-p[0])*180/Math.PI:R[i];h+='<g transform="translate('+p[0]+' '+p[1]+') rotate('+a+')"><path d="M-9 0H9M3-5L9 0L3 5" fill="none" stroke="'+(al?'var(--sage)':'var(--mute)')+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>'});return h+'</svg>'}
function miniRing(){var C=2*Math.PI*58,s=C/3,h='<svg viewBox="0 0 150 150" style="width:120px;height:120px" role="img" aria-label="A ring with two of three segments filled"><g transform="rotate(-90 75 75)">';[0,1,2].forEach(function(i){h+='<circle cx="75" cy="75" r="58" fill="none" stroke="'+(i<2?COL[i]:'var(--line)')+'" stroke-width="16" stroke-dasharray="'+(s-8)+' '+(C-s+8)+'" stroke-dashoffset="'+(-i*s)+'"/>'});return h+'</g><text x="75" y="84" text-anchor="middle" class="rn">2/3</text></svg>'}
function intro(inApp){
 var btn=inApp?'<button data-a="closeintro">Back to the app</button>':'<button data-a="go">Start my foundation</button>',
 st=function(e,t,d,g){return '<div class="card"><div class="setcard"><div class="badge" aria-hidden="true">'+e+'</div><div><h3>'+t+'</h3><p style="margin:0">'+d+'</p></div></div>'+(g?'<div style="margin-top:12px">'+g+'</div>':'')+'</div>'},
 tl=function(i,t,e){return '<div class="tile" style="'+tint({color:COL[i]})+'"><span class="em">'+e+'</span>'+t+'</div>'};
 return '<div class="hero"><svg viewBox="0 0 400 170" role="img" aria-label="A sun rising over calm hills"><circle class="sun" cx="285" cy="76" r="36"/><path d="M92 34l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#e8b547"/><path d="M0 130Q70 90 150 118T300 112T400 120V170H0Z" fill="var(--sage)" opacity=".3"/><path d="M0 150Q90 118 190 142T400 138V170H0Z" fill="var(--sage)" opacity=".55"/><path d="M0 165Q100 148 200 160T400 156V170H0Z" fill="var(--sage)"/></svg><p class="brand">Aligned</p><h1>Get your tasks aligned with your purpose.</h1><p class="lead">A to-do list built for students and working people. Every task links to who you want to become, so busy days add up to something that matters to you.</p><p>'+btn+'</p>'+(inApp?'':'<p class="mute">About 3 minutes. You can change everything later.</p>')+'</div>'+
 '<h2>The idea</h2><div class="card"><p style="margin-top:0">Most to-do lists track <i>what</i> you do. Aligned also asks <i>why</i>. When your tasks line up with your purpose, effort starts to feel meaningful.</p><div class="row"><div style="text-align:center">'+arrowsSvg(false)+'<b class="sans">Busy, but scattered</b></div><div style="text-align:center">'+arrowsSvg(true)+'<b class="sans">Aligned with your purpose</b></div></div></div>'+
 '<h2>How Aligned works</h2>'+
 st('🧭','1. Set your foundation','Write your purpose, add your values, and describe who you want to become as “be” goals. Each goal gets its own icon and color.',tl(0,'a dedicated athlete','🏀')+tl(1,'a curious learner','📚')+tl(2,'a present, caring friend','💛'))+
 st('✏️','2. Add tasks with a reason','Link each task to a “be” goal so you always see why it matters. Add how long it will take and a due date, or mark it ongoing.','<span class="chip" style="background:'+COL[1]+'26">📚 a curious learner</span> <b class="sans">Outline my essay</b> <span class="chip due">Due Fri</span>')+
 st('✍️','3. Cross it off by hand','Finishing a task is a small ritual. Draw a line through it yourself, then enjoy the confetti and a short encouragement.','<div class="strike" style="font-size:1.1rem;padding:16px">Outline my essay<svg viewBox="0 0 200 20" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true"><path d="M8 11Q50 5 100 11T192 9" stroke="#d0553e" stroke-width="4" fill="none" stroke-linecap="round"/></svg></div>')+

 '<p style="text-align:center;margin-top:24px">'+btn+'</p>'}
function slides(inApp){

function cross(id){
 var t=tk(id),ov=document.createElement('div');ov.className='ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Cross off task');
 ov.innerHTML='<div class="card cr"><p class="sans mute" style="margin:0">Draw a line through it to cross it off</p><div class="strike" id="sk">'+esc(t.text)+'<canvas id="cv"></canvas></div><div class="bar"><i id="pg" style="width:0;background:var(--rose)"></i></div><p class="row" style="margin-bottom:0"><button class="ghost small" data-a="cancel">Not yet</button><button class="ghost small" data-a="force" data-id="'+id+'">Just mark done</button></p></div>';
 document.body.appendChild(ov);
 var sk=$('#sk'),cv=$('#cv'),w=sk.offsetWidth;cv.width=w;cv.height=sk.offsetHeight;var x=cv.getContext('2d'),dn=false,lx,ly,mn=1e9,mx=0,fin=false;x.lineWidth=7;x.lineCap='round';x.strokeStyle='#d0553e';
 function p(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
 cv.onpointerdown=function(e){dn=true;var q=p(e);lx=q[0];ly=q[1];cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=function(e){if(!dn||fin)return;var q=p(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(q[0],q[1]);x.stroke();lx=q[0];ly=q[1];mn=Math.min(mn,lx);mx=Math.max(mx,lx);var pc=Math.min(1,(mx-mn)/(w*.8));$('#pg').style.width=pc*100+'%';if(pc>=1){fin=true;setTimeout(function(){ov.remove();finish(id)},250)}};
 cv.onpointerup=function(){dn=false}}

/* ---------- events ---------- */
function addValue(){var i=$('#vi'),v=i.value.trim();if(!v){i.focus();return}if(S.values.length>=7){toast('That is plenty. Seven values is the max.');return}S.values.push(v);save();render();$('#vi').focus()}
function addGoal(){var i=$('#gi'),v=i.value.trim();if(!v){i.focus();toast('Write one goal first, like “a dedicated athlete”.');return}var n=S.goals.length;S.goals.push({id:uid(),text:v,emoji:tmp.e||guess(v),color:COL[n%COL.length]});tmp.e='';save();render();var g=$('#gi');if(g)g.focus()}
document.addEventListener('keydown',function(e){if(e.key==='Enter'){if(e.target.id==='vi')addValue();else if(e.target.id==='gi')addGoal();else if(e.target.getAttribute&&e.target.getAttribute('data-a')==='tab')e.target.click()}});
document.addEventListener('input',function(e){if(e.target.id==='pu'){S.purpose=e.target.value;save()}});
document.addEventListener('change',function(e){if(e.target.id==='on')$('#td').disabled=e.target.checked});
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,id=el.dataset.id;
 if(a==='intro'){showIntro=true;islide=0;render()}else if(a==='snext'){islide++;render()}else if(a==='sprev'){islide--;render()}else if(a==='closeintro'){showIntro=false;render()}else if(a==='go'){S.step=1;save();render()}
 else if(a==='next'){if(S.step===1){var v=$('#pu').value.trim();if(!v){toast('Write your purpose to continue.');return}S.purpose=v}if(S.step===2&&!S.values.length){toast('Add at least one value to continue.');return}S.step++;save();render()}
 else if(a==='back'){S.step--;save();render()}
 else if(a==='fin'){S.setup=true;S.tab='today';save();render()}
 else if(a==='role'){S.role=el.dataset.r;save();document.querySelectorAll('[data-a=role]').forEach(function(b){b.setAttribute('aria-pressed',b===el)})}
 else if(a==='av')addValue();
 else if(a==='rv'){S.values.splice(+el.dataset.i,1);save();render()}
 else if(a==='ag')addGoal();
 else if(a==='rg'){if(S.setup&&S.goals.length<2){toast('Keep at least one goal.');return}S.goals=S.goals.filter(function(g){return g.id!==id});save();render()}
 else if(a==='ex'){$('#gi').value=el.dataset.t;tmp.e=el.dataset.e;document.querySelectorAll('[data-a=emo]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.e===tmp.e)});$('#gi').focus()}
 else if(a==='emo'){tmp.e=el.dataset.e;document.querySelectorAll('[data-a=emo]').forEach(function(b){b.setAttribute('aria-pressed',b===el)})}
 else if(a==='tab'){S.tab=el.dataset.t;S.off=0;S.sel='';save();render();window.scrollTo(0,0)}
 else if(a==='pg'){tmp.g=id;document.querySelectorAll('[data-a=pg]').forEach(function(b){b.setAttribute('aria-pressed',b===el)});$('#whyw').hidden=id!=='_why'}
 else if(a==='addt'){
  var tx=$('#tt').value.trim();if(!tx){$('#tt').focus();toast('Type what needs doing first.');return}
  var dn=parseInt($('#tm').value,10)||0,du=$('#tu'),on=$('#on').checked,t={id:uid(),text:tx,goalId:null,why:'',mins:dn*(+du.value),durN:dn,durU:du.options[du.selectedIndex].text,due:on?'':$('#td').value,ongoing:on,done:false,created:Date.now()};
  if(tmp.g==='_why')t.why=$('#tw').value.trim();else if(tmp.g)t.goalId=tmp.g;
  tmp.g='';S.tasks.push(t);save();render();var g=t.goalId&&goal(t.goalId);toast(g?'Added. This one is part of being '+g.text.toLowerCase()+' '+g.emoji:t.why?'Added. It matters because '+t.why:'Added. Link a goal next time to light up your ring.')}
 else if(a==='tog')cross(id);
 else if(a==='force'){document.querySelector('.ov').remove();finish(id)}
 else if(a==='cancel')document.querySelector('.ov').remove();
 else if(a==='undo'){var u=tk(id);u.done=false;u.doneAt=null;save();render()}
 else if(a==='del'){S.tasks=S.tasks.filter(function(t){return t.id!==id});save();render()}
 else if(a==='cm'){S.mode=el.dataset.m;S.off=0;S.sel='';save();render()}
 else if(a==='cn'){var d=+el.dataset.d;S.off=d?S.off+d:0;S.sel='';render()}
 else if(a==='cd'){S.sel=S.sel===el.dataset.d?'':el.dataset.d;render()}
 else if(a==='rate'){tmp.nt=($('#nt')||{}).value||'';tmp.ng=($('#ng')||{}).value||tmp.ng;tmp.rating=+el.dataset.n;render()}
 else if(a==='blk'){tmp.nt=($('#nt')||{}).value||'';tmp.ng=($('#ng')||{}).value||tmp.ng;tmp.block=el.dataset.b;render()}
 else if(a==='sv'){if(!tmp.rating){toast('Pick a rating from 1 to 5 first.');return}var nt=$('#nt').value.trim(),ng=$('#ng').value;S.reviews.push({week:wk(new Date()),rating:tmp.rating,block:tmp.block,next:nt});if(nt)S.tasks.push({id:uid(),text:nt,goalId:ng,why:'',mins:0,durN:0,durU:'',due:'',ongoing:false,done:false,created:Date.now()});tmp={e:'',g:'',rating:0,block:'',nt:'',ng:''};save();render();toast(nt?'Saved. Your step is on the Today list.':'Check-in saved.')}
 else if(a==='reset'){el.parentNode.innerHTML='<span class="sans">Erase everything and start over?</span> <button class="small" data-a="reset2">Yes, erase</button> <button class="ghost small" data-a="resetno">Cancel</button>'}
 else if(a==='resetno'){render()}
 else if(a==='reset2'){try{localStorage.removeItem(KEY)}catch(x){}S={setup:false,step:0,role:'',purpose:'',values:[],goals:[],tasks:[],reviews:[],tab:'today',mode:'week',off:0,sel:''};tmp={e:'',g:'',rating:0,block:'',nt:'',ng:''};islide=0;render();window.scrollTo(0,0)}
});
render();
})();
</script></body></html>
